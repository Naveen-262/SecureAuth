<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="SecureAuth Admin Dashboard - Manage users and monitor platform activity">

    <title>SecureAuth | Admin Dashboard</title>

    <link rel="stylesheet" href="css/admin.css">

    <script src="js/admin.js" defer></script>
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <h2>🔐 SecureAuth Admin</h2>

        <button type="button" id="logoutBtn">
            Logout
        </button>
    </header>

    <main class="container">

        <!-- WELCOME SECTION -->
        <section class="welcome">
            <h1>Admin Dashboard</h1>

            <p>
                Manage users and monitor platform activity.
            </p>
        </section>

        <!-- ANALYTICS -->
        <section class="stats">

            <div class="stat-card">
                <h3>Total Users</h3>
                <h1 id="totalUsers">--</h1>
            </div>

            <div class="stat-card">
                <h3>Admin Accounts</h3>
                <h1 id="totalAdmins">--</h1>
            </div>

            <div class="stat-card">
                <h3>Regular Users</h3>
                <h1 id="regularUsers">--</h1>
            </div>

        </section>

        <!-- USER MANAGEMENT -->
        <section class="users-section">

            <div class="section-heading">

                <h2>User Management</h2>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search users by name or email..."
                    aria-label="Search users by name or email"
                    autocomplete="off"
                >

            </div>

            <!-- STATUS MESSAGE -->
            <p
                id="statusMessage"
                role="status"
                aria-live="polite"
            ></p>

            <!-- USERS TABLE -->
            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th scope="col">Name</th>
                            <th scope="col">Email</th>
                            <th scope="col">Role</th>
                            <th scope="col">Joined</th>
                            <th scope="col">Action</th>
                        </tr>
                    </thead>

                    <tbody id="usersTable">

                        <tr>
                            <td colspan="5">
                                Loading users...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</body>
</html>
